<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KIM website</title>
	<style>
		.draggable-image {
			position: absolute;
			cursor: grab;
			user-select: none;
		}
		.draggable-image:active {
			cursor: grabbing;
		}
		.icon-container {
			position: absolute;
			width: 80px;
			text-align: center;
			cursor: pointer;
			user-select: none;
			top: 20px;
			left: 20px;
		}

		.icon-image {
			width: 64px;
			height: 64px;
			margin: 0 auto 8px;
			transition: transform 0.2s;
		}

		.icon-container:hover .icon-image {
			transform: scale(1.1);
		}

		.icon-label {
			font-size: 12px;
			color: white;
			text-shadow: 1px 1px 2px black;
			word-wrap: break-word;
			font-family: Arial, sans-serif;
		}

		.window {
			position: absolute;
			background: #c0c0c0;
			border: 2px solid;
			border-color: #dfdfdf #808080 #808080 #dfdfdf;
			display: none;
			min-width: 300px;
			min-height: 200px;
			box-shadow: 1px 1px 0 0 #dfdfdf inset, -1px -1px 0 0 #808080 inset;
		}

		.window.open {
			display: block;
		}

		.window-titlebar {
			background-color: #7b9a8a;
			color: white;
			padding: 2px 2px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			cursor: move;
			font-family: Arial, sans-serif;
			font-size: 12px;
			font-weight: bold;
		}

		.window-title {
			flex-grow: 1;
			padding: 2px 4px;
		}

		.window-close {
			width: 18px;
			height: 14px;
			background: #c0c0c0;
			border: 1px solid;
			border-color: #dfdfdf #000000 #000000 #dfdfdf;
			color: black;
			font-size: 10px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 2px;
		}

		.window-close:active {
			border-color: #000000 #dfdfdf #dfdfdf #000000;
		}

		.window-content {
			padding: 10px;
			overflow: auto;
			height: calc(100% - 24px);
		}

		.music-bar {
			position: fixed;
			bottom: 10px;
			left: 50%;
			transform: translateX(-50%);
			width: 450px;
			height: 40px;
			background: #c0c0c0;
			border: 2px solid;
			border-color: #dfdfdf #808080 #808080 #dfdfdf;
			box-shadow: 1px 1px 0 0 #dfdfdf inset, -1px -1px 0 0 #808080 inset;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 3px 8px;
			font-family: Arial, sans-serif;
			font-size: 11px;
			cursor: move;
			user-select: none;
		}

		.music-bar-title {
			font-weight: bold;
			color: #000;
			flex-shrink: 0;
		}

		.music-info {
			flex-grow: 1;
			text-align: center;
			color: #000;
			margin: 0 10px;
		}

		.music-controls {
			display: flex;
			gap: 5px;
			flex-shrink: 0;
		}

		.volume-controls {
			display: flex;
			align-items: center;
			gap: 3px;
			margin-left: 8px;
			padding-left: 8px;
			border-left: 1px solid #808080;
		}

		.volume-indicator {
			font-size: 9px;
			color: #000;
			min-width: 30px;
			text-align: center;
			background: #c0c0c0;
			border: 1px solid;
			border-color: #dfdfdf #000000 #000000 #dfdfdf;
			padding: 1px 2px;
		}

		.music-control-btn {
			width: 18px;
			height: 18px;
			background: #c0c0c0;
			border: 1px solid;
			border-color: #dfdfdf #000000 #000000 #dfdfdf;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 9px;
		}

		.music-control-btn:active {
			border-color: #000000 #dfdfdf #dfdfdf #000000;
		}
	</style>
</head>
<body style="background-image: url('Bliss.png'); background-attachment: fixed; background-size: cover; background-position: center; margin: 0; padding: 0; overflow: hidden;">

<!-- Desktop Icons -->

	<div class="icon-container" id="icon-0" style="top: 20px; left: 20px;">
		<img class="icon-image" src="recycle.png" alt="Home Icon">
		<div class="icon-label">Recycle Bin</div>
	</div>

	<div class="icon-container" id="icon-1" style="top: 120px; left: 20px;">
		<img class="icon-image" src="locked.png" alt="Icon 1">
		<div class="icon-label">Profile</div>
	</div>

	<div class="icon-container" id="icon-2" style="top: 220px; left: 20px;">
		<img class="icon-image" src="locked.png" alt="Icon 2">
		<div class="icon-label">Social Media</div>
	</div>

	<div class="icon-container" id="icon-3" style="top: 320px; left: 20px;">
		<img class="icon-image" src="text.png" alt="Icon 3">
		<div class="icon-label">Portfolio</div>
	</div>

<!-- Windows -->

	<div class="window" id="window-0">
		<div class="window-titlebar">
			<div class="window-title">Recycle Bin</div>
			<div class="window-close" data-close="window-0">✕</div>
		</div>
		<div class="window-content">
			<p>UNDER CONSTRUCTION</p>
		</div>
	</div>

	<div class="window" id="window-1">
		<div class="window-titlebar">
			<div class="window-title">Profile.prof</div>
			<div class="window-close" data-close="window-1">✕</div>
		</div>
		<div class="window-content">
			<p><img src="KIMprofile.png" alt="Profile Image" style="width: 100%; height: auto;" /></p>
		</div>
	</div>

	<div class="window" id="window-2">
		<div class="window-titlebar">
			<div class="window-title">Social Media.txt</div>
			<div class="window-close" data-close="window-2">✕</div>
		</div>
		<div class="window-content">
			<div style="position: relative; display: inline-block;">
				<img src="Template1.png" alt="Social Media Image" style="width: auto; height: auto;" />
				<a href="https://www.instagram.com/hickory877/" target="_blank" style="position: absolute; left: 80px; top: 19%; color: #0066cc; text-decoration: none; font-weight: bold; font-size: 16px;">Instagram</a>
				<a href="https://www.youtube.com/channel/UCkkbIO03JCa13n2zCHBICIA" target="_blank" style="position: absolute; left: 80px; top: 47%; color: #0066cc; text-decoration: none; font-weight: bold; font-size: 16px;">YouTube</a>
				<a href="https://linktr.ee/hickory87" target="_blank" style="position: absolute; left: 80px; top: 73%; color: #0066cc; text-decoration: none; font-weight: bold; font-size: 16px;">LinkTree</a>
			</div>
		</div>
	</div>

	<div class="window" id="window-3">
		<div class="window-titlebar">
			<div class="window-title">Portfolio.docu</div>
			<div class="window-close" data-close="window-3">✕</div>
		</div>
		<div class="window-content">
			<p>!UNDER CONSTRUCTION!</p>
		</div>
	</div>

<!-- Music Bar -->
	<div class="music-bar" id="music-bar">
		<div class="music-bar-title">Now Playing</div>
		<div class="music-info">No song selected</div>
		<div class="music-controls">
			<div class="music-control-btn" id="prev-btn">⏮</div>
			<div class="music-control-btn" id="play-btn">▶</div>
			<div class="music-control-btn" id="next-btn">⏭</div>
			<div class="volume-controls">
				<div class="music-control-btn" id="vol-down-btn">🔉</div>
				<div class="volume-indicator" id="volume-indicator">20%</div>
				<div class="music-control-btn" id="vol-up-btn">🔊</div>
			</div>
		</div>
	</div>

	<!-- Hidden audio element -->
	<audio id="audio-player" preload="metadata">
		<source src="The Great KIM.mp3" type="audio/mpeg">
		Your browser does not support the audio element.
	</audio>

	<script>
		// Icon and Window Management
		const iconWindows = {
			'icon-0': 'window-0',
			'icon-1': 'window-1',
			'icon-2': 'window-2',
			'icon-3': 'window-3'
		};

		const windowState = {};

		// Initialize window states
		Object.values(iconWindows).forEach(windowId => {
			windowState[windowId] = false;
		});

		// Handle icon clicks
		Object.keys(iconWindows).forEach(iconId => {
			const icon = document.getElementById(iconId);
			const windowId = iconWindows[iconId];
			const img = icon.querySelector('.icon-image');

			icon.addEventListener('click', () => {
				const windowEl = document.getElementById(windowId);
				windowState[windowId] = !windowState[windowId];
				if (windowState[windowId]) {
					// Open window
					windowEl.classList.add('open');
					img.src = 'unlocked.png';
				} else {
					// Close window
					windowEl.classList.remove('open');
					img.src = 'locked.png';
					}

				// Special handling for Recycle Bin
				if (windowId === 'window-0' && windowState[windowId]) {
					windowEl.classList.add('open');
					img.src = 'recycle.png';
				}
				if (windowId === 'window-0' && !windowState[windowId]) {
					windowEl.classList.remove('open');
					img.src = 'recycle.png';} 

				//Special handling for Portfolio
				if (windowId === 'window-3' && windowState[windowId]) {
					windowEl.classList.add('open');
					img.src = 'text.png';
				} 
				if (windowId === 'window-3' && !windowState[windowId]) {
					windowEl.classList.remove('open');
					img.src = 'text.png';
			}})});
		// Handle window close buttons
		document.querySelectorAll('.window-close').forEach(closeBtn => {
			closeBtn.addEventListener('click', (e) => {
				e.stopPropagation();
				const windowId = closeBtn.getAttribute('data-close');
				const windowEl = document.getElementById(windowId);
				windowEl.classList.remove('open');
				windowState[windowId] = false;

				// Update icon image
				const iconId = Object.keys(iconWindows).find(key => iconWindows[key] === windowId);
				const img = document.getElementById(iconId).querySelector('.icon-image');
				img.src = 'locked.png';
				if (windowId === 'window-0') {
					img.src = 'recycle.png';
				}
				if (windowId === 'window-3') {
					img.src = 'text.png';
				}
			});
		});

		// Make windows draggable
		const windows = document.querySelectorAll('.window');
		windows.forEach(windowEl => {
			let isDragging = false;
			let dragOffsetX = 0;
			let dragOffsetY = 0;

			const titlebar = windowEl.querySelector('.window-titlebar');
			titlebar.addEventListener('mousedown', (e) => {
				isDragging = true;
				dragOffsetX = e.clientX - windowEl.offsetLeft;
				dragOffsetY = e.clientY - windowEl.offsetTop;
			});

			document.addEventListener('mousemove', (e) => {
				if (isDragging) {
					windowEl.style.left = (e.clientX - dragOffsetX) + 'px';
					windowEl.style.top = (e.clientY - dragOffsetY) + 'px';
				}
			});

		document.addEventListener('mouseup', () => {
			isDragging = false;
		});
		});

		// Make music bar draggable
		const musicBar = document.getElementById('music-bar');
		let isDraggingMusic = false;
		let dragOffsetX = 0;
		let dragOffsetY = 0;

		musicBar.addEventListener('mousedown', (e) => {
			isDraggingMusic = true;
			const rect = musicBar.getBoundingClientRect();
			dragOffsetX = e.clientX - rect.left;
			dragOffsetY = e.clientY - rect.top;
			musicBar.style.position = 'absolute';
			musicBar.style.left = rect.left + 'px';
			musicBar.style.top = rect.top + 'px';
			musicBar.style.transform = 'none';
			musicBar.style.bottom = 'auto';
		});

		document.addEventListener('mousemove', (e) => {
			if (isDraggingMusic) {
				musicBar.style.left = (e.clientX - dragOffsetX) + 'px';
				musicBar.style.top = (e.clientY - dragOffsetY) + 'px';
			}
		});

		document.addEventListener('mouseup', () => {
			isDraggingMusic = false;
		});

		// Initialize audio player
		const audioPlayer = document.getElementById('audio-player');
		const musicInfo = document.querySelector('.music-info');
		const playBtn = document.getElementById('play-btn');
		const volumeIndicator = document.getElementById('volume-indicator');

		// Function to update volume indicator
		function updateVolumeIndicator() {
			const volumePercent = Math.round(audioPlayer.volume * 100);
			volumeIndicator.textContent = volumePercent + '%';
		}

		// Set initial low volume and update indicator
		audioPlayer.volume = 0.2;
		updateVolumeIndicator();

		// Update music info when metadata loads
		audioPlayer.addEventListener('loadedmetadata', () => {
			musicInfo.textContent = 'The Great KIM';
		});

		// Handle play/pause button
		playBtn.addEventListener('click', () => {
			if (audioPlayer.paused) {
				audioPlayer.play();
				playBtn.textContent = '⏸';
				musicInfo.textContent = 'Playing: The Great KIM';
			} else {
				audioPlayer.pause();
				playBtn.textContent = '▶';
				musicInfo.textContent = 'Paused: The Great KIM';
			}
		});

		// Handle previous button (restart song)
		document.getElementById('prev-btn').addEventListener('click', () => {
			audioPlayer.currentTime = 0;
			if (!audioPlayer.paused) {
				musicInfo.textContent = 'Restarted: The Great KIM';
			} else {
				musicInfo.textContent = 'The Great KIM';
			}
		});

		// Handle next button (restart song for single track)
		document.getElementById('next-btn').addEventListener('click', () => {
			audioPlayer.currentTime = 0;
			if (!audioPlayer.paused) {
				musicInfo.textContent = 'Restarted: The Great KIM';
			} else {
				musicInfo.textContent = 'The Great KIM';
			}
		});

		// Handle volume down button
		document.getElementById('vol-down-btn').addEventListener('click', () => {
			if (audioPlayer.volume > 0.1) {
				audioPlayer.volume = Math.max(0, audioPlayer.volume - 0.1);
				updateVolumeIndicator();
			}
		});

		// Handle volume up button
		document.getElementById('vol-up-btn').addEventListener('click', () => {
			if (audioPlayer.volume < 1.0) {
				audioPlayer.volume = Math.min(1, audioPlayer.volume + 0.1);
				updateVolumeIndicator();
			}
		});

		// Handle song end
		audioPlayer.addEventListener('ended', () => {
			playBtn.textContent = '▶';
			musicInfo.textContent = 'Finished: The Great KIM';
		});
	</script>
</body>
</html>
