<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KIM website</title>
	<style>
		.draggable-image {
			position: absolute;
			cursor: grab;
			user-select: none;
		}
		.draggable-image:active {
			cursor: grabbing;
		}
		.icon-container {
			position: absolute;
			width: 80px;
			text-align: center;
			cursor: pointer;
			user-select: none;
			top: 20px;
			left: 20px;
		}

		.icon-image {
			width: 64px;
			height: 64px;
			margin: 0 auto 8px;
			transition: transform 0.2s;
		}

		.icon-container:hover .icon-image {
			transform: scale(1.1);
		}

		.icon-label {
			font-size: 12px;
			color: white;
			text-shadow: 1px 1px 2px black;
			word-wrap: break-word;
			font-family: Arial, sans-serif;
		}

		.window {
			position: absolute;
			background: #c0c0c0;
			border: 2px solid;
			border-color: #dfdfdf #808080 #808080 #dfdfdf;
			display: none;
			min-width: 300px;
			min-height: 200px;
			box-shadow: 1px 1px 0 0 #dfdfdf inset, -1px -1px 0 0 #808080 inset;
		}

		.window.open {
			display: block;
		}

		.window-titlebar {
			background-color: #7b9a8a;
			color: white;
			padding: 2px 2px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			cursor: move;
			font-family: Arial, sans-serif;
			font-size: 12px;
			font-weight: bold;
		}

		.window-title {
			flex-grow: 1;
			padding: 2px 4px;
		}

		.window-close {
			width: 18px;
			height: 14px;
			background: #c0c0c0;
			border: 1px solid;
			border-color: #dfdfdf #000000 #000000 #dfdfdf;
			color: black;
			font-size: 10px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 2px;
		}

		.window-close:active {
			border-color: #000000 #dfdfdf #dfdfdf #000000;
		}

		.window-content {
			padding: 10px;
			overflow: auto;
			height: calc(100% - 24px);
		}

		.music-bar {
			position: fixed;
			top: 10px;
			left: 50%;
			transform: translateX(-50%);
			width: 450px;
			height: 40px;
			background: #c0c0c0;
			border: 2px solid;
			border-color: #dfdfdf #808080 #808080 #dfdfdf;
			box-shadow: 1px 1px 0 0 #dfdfdf inset, -1px -1px 0 0 #808080 inset;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 3px 8px;
			font-family: Arial, sans-serif;
			font-size: 11px;
			cursor: move;
			user-select: none;
		}

		.music-bar-title {
			font-weight: bold;
			color: #000;
			flex-shrink: 0;
		}

		.music-info {
			flex-grow: 1;
			text-align: center;
			color: #000;
			margin: 0 10px;
		}

		.music-controls {
			display: flex;
			gap: 5px;
			flex-shrink: 0;
		}

		.volume-controls {
			display: flex;
			align-items: center;
			gap: 3px;
			margin-left: 8px;
			padding-left: 8px;
			border-left: 1px solid #808080;
		}

		.volume-indicator {
			font-size: 9px;
			color: #000;
			min-width: 30px;
			text-align: center;
			background: #c0c0c0;
			border: 1px solid;
			border-color: #dfdfdf #000000 #000000 #dfdfdf;
			padding: 1px 2px;
		}

		.music-control-btn {
			width: 18px;
			height: 18px;
			background: #c0c0c0;
			border: 1px solid;
			border-color: #dfdfdf #000000 #000000 #dfdfdf;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 9px;
		}

		.music-control-btn:active {
			border-color: #000000 #dfdfdf #dfdfdf #000000;
		}

		.music-control-btn.repeat-active {
			background: linear-gradient(to bottom, #f0f0f0, #a0a0a0);
			border-color: #808080 #dfdfdf #dfdfdf #808080;
		}

		/* Windows XP Taskbar Styles */
		.taskbar {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			height: 30px;
			background: linear-gradient(to bottom, #3a6ea5, #1e3a5f);
			border-top: 1px solid #0a246a;
			display: flex;
			align-items: center;
			padding: 0 2px;
			z-index: 1000;
		}

		.start-button {
			height: 26px;
			background: linear-gradient(to bottom, #f0f0f0, #c0c0c0);
			border: 1px solid;
			border-color: #dfdfdf #808080 #808080 #dfdfdf;
			display: flex;
			align-items: center;
			padding: 0 8px;
			cursor: pointer;
			font-family: Arial, sans-serif;
			font-size: 11px;
			font-weight: bold;
			color: #000;
			margin-right: 2px;
			box-shadow: 1px 1px 0 0 #dfdfdf inset, -1px -1px 0 0 #808080 inset;
		}

		.start-button:active {
			border-color: #808080 #dfdfdf #dfdfdf #808080;
			box-shadow: -1px -1px 0 0 #dfdfdf inset, 1px 1px 0 0 #808080 inset;
		}

		.start-icon {
			width: 16px;
			height: 16px;
			margin-right: 4px;
		}

		.taskbar-apps {
			flex-grow: 1;
			display: flex;
			align-items: center;
			gap: 2px;
		}

		.taskbar-button {
			height: 24px;
			background-color: #1c4d24;
			border: 1px solid;
			border-color: #dfdfdf #808080 #808080 #dfdfdf;
			display: flex;
			align-items: center;
			padding: 0 6px;
			cursor: pointer;
			font-family: Arial, sans-serif;
			font-size: 10px;
			color: #000;
			min-width: 120px;
			box-shadow: 1px 1px 0 0 #dfdfdf inset, -1px -1px 0 0 #808080 inset;
		}

		.taskbar-button.active {
			background: linear-gradient(to bottom, #f0f0f0, #c0c0c0);
			border-color: #808080 #dfdfdf #dfdfdf #808080;
			box-shadow: -1px -1px 0 0 #dfdfdf inset, 1px 1px 0 0 #808080 inset;
		}

		.taskbar-button:hover {
			background: linear-gradient(to bottom, #e8e4d8, #c8c4b8);
		}

		.taskbar-button-icon {
			width: 14px;
			height: 14px;
			margin-right: 4px;
		}

		.taskbar-tray {
			display: flex;
			align-items: center;
			gap: 2px;
			margin-left: auto;
		}

		.tray-item {
			width: 20px;
			height: 20px;
			background: linear-gradient(to bottom, #d4d0c8, #b8b4a8);
			border: 1px solid;
			border-color: #dfdfdf #808080 #808080 #dfdfdf;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			font-size: 10px;
			box-shadow: 1px 1px 0 0 #dfdfdf inset, -1px -1px 0 0 #808080 inset;
		}

		.tray-item:active {
			border-color: #808080 #dfdfdf #dfdfdf #808080;
			box-shadow: -1px -1px 0 0 #dfdfdf inset, 1px 1px 0 0 #808080 inset;
		}

		.clock {
			background-color: #1990be;
			color: #d6d6d6;
			font-family: 'Courier New', monospace;
			font-size: 16px;
			font-weight: bold;
			padding: 0 4px;
			min-width: 60px;
			text-align: center;
			height: 30px;
			display: flex;
			align-items: center;
			justify-content: center;

		}

		/* Start Menu Styles */
		.start-menu {
			position: absolute;
			bottom: 32px;
			left: 0;
			width: 200px;
			background: linear-gradient(to bottom, #d4d0c8, #b8b4a8);
			border: 2px solid;
			border-color: #dfdfdf #808080 #808080 #dfdfdf;
			box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
			display: none;
			z-index: 2000;
			font-family: Arial, sans-serif;
			font-size: 11px;
		}

		.start-menu.show {
			display: block;
		}

		.start-menu-header {
			background: linear-gradient(to bottom, #7b9a8a, #5a7a6a);
			color: white;
			padding: 8px;
			font-weight: bold;
			border-bottom: 1px solid #808080;
		}

		.start-menu-item {
			padding: 6px 12px;
			cursor: pointer;
			border-bottom: 1px solid #808080;
			display: flex;
			align-items: center;
		}

		.start-menu-item:hover {
			background: linear-gradient(to bottom, #f0f0f0, #c0c0c0);
		}

		.start-menu-item:last-child {
			border-bottom: none;
		}

		.start-menu-item-icon {
			width: 16px;
			height: 16px;
			margin-right: 8px;
		}

		.start-menu-separator {
			height: 1px;
			background: #808080;
			margin: 2px 0;
		}
	</style>
</head>

	<!-- Hidden audio element -->

		<source src="The Great KIM.mp3" type="audio/mpeg">

	</audio>

	<script>
		// Icon and Window Management
		const iconWindows = {
			'icon-0': 'window-0',
			'icon-1': 'window-1',
			'icon-2': 'window-2',
			'icon-3': 'window-3'
		};

		const windowState = {};

		// Initialize window states
		Object.values(iconWindows).forEach(windowId => {
			windowState[windowId] = false;
		});

		// Make windows draggable
		const windows = document.querySelectorAll('.window');
		windows.forEach(windowEl => {
			let isDragging = false;
			let dragOffsetX = 0;
			let dragOffsetY = 0;

			const titlebar = windowEl.querySelector('.window-titlebar');
			titlebar.addEventListener('mousedown', (e) => {
				isDragging = true;
				dragOffsetX = e.clientX - windowEl.offsetLeft;
				dragOffsetY = e.clientY - windowEl.offsetTop;
			});

			document.addEventListener('mousemove', (e) => {
				if (isDragging) {
					windowEl.style.left = (e.clientX - dragOffsetX) + 'px';
					windowEl.style.top = (e.clientY - dragOffsetY) + 'px';
				}
			});

		document.addEventListener('mouseup', () => {
			isDragging = false;
		});
		});

		// Make music bar draggable
		const musicBar = document.getElementById('music-bar');
		let isDraggingMusic = false;
		let dragOffsetX = 0;
		let dragOffsetY = 0;

		musicBar.addEventListener('mousedown', (e) => {
			isDraggingMusic = true;
			const rect = musicBar.getBoundingClientRect();
			dragOffsetX = e.clientX - rect.left;
			dragOffsetY = e.clientY - rect.top;
			musicBar.style.position = 'absolute';
			musicBar.style.left = rect.left + 'px';
			musicBar.style.top = rect.top + 'px';
			musicBar.style.transform = 'none';
			musicBar.style.bottom = 'auto';
		});

		document.addEventListener('mousemove', (e) => {
			if (isDraggingMusic) {
				musicBar.style.left = (e.clientX - dragOffsetX) + 'px';
				musicBar.style.top = (e.clientY - dragOffsetY) + 'px';
			}
		});

		document.addEventListener('mouseup', () => {
			isDraggingMusic = false;
		});

		// Initialize audio player
		const audioPlayer = document.getElementById('audio-player');
		const musicInfo = document.querySelector('.music-info');
		const playBtn = document.getElementById('play-btn');
		const volumeIndicator = document.getElementById('volume-indicator');

		// Function to update volume indicator
		function updateVolumeIndicator() {
			const volumePercent = Math.round(audioPlayer.volume * 100);
			volumeIndicator.textContent = volumePercent + '%';
		}

		// Set initial low volume and update indicator
		audioPlayer.volume = 0.2;
		updateVolumeIndicator();

		// Update music info when metadata loads
		audioPlayer.addEventListener('loadedmetadata', () => {
			musicInfo.textContent = 'The Great KIM';
		});

		// Handle play/pause button
		playBtn.addEventListener('click', () => {
			if (audioPlayer.paused) {
				audioPlayer.play();
				playBtn.textContent = '⏸';
				musicInfo.textContent = 'Playing: The Great KIM';
			} else {
				audioPlayer.pause();
				playBtn.textContent = '▶';
				musicInfo.textContent = 'Paused: The Great KIM';
			}
		});

		// Handle previous button (restart song)
		document.getElementById('prev-btn').addEventListener('click', () => {
			audioPlayer.currentTime = 0;
			if (!audioPlayer.paused) {
				musicInfo.textContent = 'Restarted: The Great KIM';
			} else {
				musicInfo.textContent = 'The Great KIM';
			}
		});

		// Handle next button (restart song for single track)
		document.getElementById('next-btn').addEventListener('click', () => {
			audioPlayer.currentTime = 0;
			if (!audioPlayer.paused) {
				musicInfo.textContent = 'Restarted: The Great KIM';
			} else {
				musicInfo.textContent = 'The Great KIM';
			}
		});

		// Handle volume down button
		document.getElementById('vol-down-btn').addEventListener('click', () => {
			if (audioPlayer.volume > 0.1) {
				audioPlayer.volume = Math.max(0, audioPlayer.volume - 0.1);
				updateVolumeIndicator();
			}
		});

		// Handle volume up button
		document.getElementById('vol-up-btn').addEventListener('click', () => {
			if (audioPlayer.volume < 1.0) {
				audioPlayer.volume = Math.min(1, audioPlayer.volume + 0.1);
				updateVolumeIndicator();
			}
		});

		// Handle repeat button
		let isRepeatEnabled = false;
		const repeatBtn = document.getElementById('repeat-btn');
		repeatBtn.addEventListener('click', () => {
			isRepeatEnabled = !isRepeatEnabled;
			if (isRepeatEnabled) {
				repeatBtn.classList.add('repeat-active');
				musicInfo.textContent = 'Repeat: ON - The Great KIM';
			} else {
				repeatBtn.classList.remove('repeat-active');
				if (!audioPlayer.paused) {
					musicInfo.textContent = 'Playing: The Great KIM';
				} else {
					musicInfo.textContent = 'The Great KIM';
				}
			}
		});

		// Handle song end
		audioPlayer.addEventListener('ended', () => {
			if (isRepeatEnabled) {
				audioPlayer.currentTime = 0;
				audioPlayer.play();
				playBtn.textContent = '⏸';
				musicInfo.textContent = 'Repeat: ON - The Great KIM';
			} else {
				playBtn.textContent = '▶';
				musicInfo.textContent = 'Finished: The Great KIM';
			}
		});

		// Taskbar functionality
		const taskbarApps = document.getElementById('taskbar-apps');
		const startButton = document.getElementById('start-button');
		const startMenu = document.getElementById('start-menu');
		const clock = document.getElementById('clock');

		// Window titles for taskbar buttons
		const windowTitles = {
			'window-0': 'Recycle Bin',
			'window-1': 'Profile.prof',
			'window-2': 'Social Media.txt',
			'window-3': 'Portfolio.doc'
		};

		// Window icons for taskbar buttons
		const windowIcons = {
			'window-0': 'recycle.png',
			'window-1': 'locked.png',
			'window-2': 'locked.png',
			'window-3': 'text.png'
		};

		// Function to update clock
		function updateClock() {
			const now = new Date();
			let hours = now.getHours();
			const minutes = now.getMinutes().toString().padStart(2, '0');
			const ampm = hours >= 12 ? 'PM' : 'AM';
			hours = hours % 12;
			hours = hours ? hours : 12; // Convert 0 to 12
			clock.textContent = `${hours}:${minutes} ${ampm}`;
		}

		// Update clock every second
		setInterval(updateClock, 1000);
		updateClock(); // Initial update

		// Function to create taskbar button
		function createTaskbarButton(windowId) {
			const button = document.createElement('div');
			button.className = 'taskbar-button';
			button.id = `taskbar-${windowId}`;
			button.innerHTML = `
				<img class="taskbar-button-icon" src="${windowIcons[windowId]}" alt="" onerror="this.style.display='none'">
				<span>${windowTitles[windowId]}</span>
			`;

			button.addEventListener('click', () => {
				const windowEl = document.getElementById(windowId);
				const isOpen = windowEl.classList.contains('open');

				if (isOpen) {
					// Minimize window
					windowEl.classList.remove('open');
					windowState[windowId] = false;
					button.classList.remove('active');

					// Update icon
					const iconId = Object.keys(iconWindows).find(key => iconWindows[key] === windowId);
					const img = document.getElementById(iconId).querySelector('.icon-image');
					img.src = 'locked.png';
					if (windowId === 'window-0') img.src = 'recycle.png';
					if (windowId === 'window-3') img.src = 'text.png';
				} else {
					// Restore window
					windowEl.classList.add('open');
					windowState[windowId] = true;
					button.classList.add('active');

					// Update icon
					const iconId = Object.keys(iconWindows).find(key => iconWindows[key] === windowId);
					const img = document.getElementById(iconId).querySelector('.icon-image');
					img.src = 'unlocked.png';
					if (windowId === 'window-0') img.src = 'recycle.png';
					if (windowId === 'window-3') img.src = 'text.png';
				}
			});

			return button;
		}

		// Function to update taskbar buttons
		function updateTaskbarButtons() {
			// Clear existing buttons
			taskbarApps.innerHTML = '';

			// Add buttons for open windows
			Object.keys(windowState).forEach(windowId => {
				if (windowState[windowId]) {
					const button = createTaskbarButton(windowId);
					button.classList.add('active');
					taskbarApps.appendChild(button);
				}
			});
		}

		// Override window opening/closing to update taskbar
		const originalIconClickHandler = (iconId) => {
			const icon = document.getElementById(iconId);
			const windowId = iconWindows[iconId];
			const img = icon.querySelector('.icon-image');

			const wasOpen = windowState[windowId];
			windowState[windowId] = !windowState[windowId];

			const windowEl = document.getElementById(windowId);
			if (windowState[windowId]) {
				windowEl.classList.add('open');
				img.src = 'unlocked.png';
			} else {
				windowEl.classList.remove('open');
				img.src = 'locked.png';
			}

			// Special handling for Recycle Bin
			if (windowId === 'window-0') {
				img.src = 'recycle.png';
			}
			// Special handling for Portfolio
			if (windowId === 'window-3') {
				img.src = 'text.png';
			}

			updateTaskbarButtons();
		};

		// Update icon click handlers
		Object.keys(iconWindows).forEach(iconId => {
			const icon = document.getElementById(iconId);
			icon.addEventListener('click', () => originalIconClickHandler(iconId));
		});

		// Update window close handlers
		document.querySelectorAll('.window-close').forEach(closeBtn => {
			closeBtn.addEventListener('click', (e) => {
				e.stopPropagation();
				const windowId = closeBtn.getAttribute('data-close');
				const windowEl = document.getElementById(windowId);
				windowEl.classList.remove('open');
				windowState[windowId] = false;

				// Update icon image
				const iconId = Object.keys(iconWindows).find(key => iconWindows[key] === windowId);
				const img = document.getElementById(iconId).querySelector('.icon-image');
				img.src = 'locked.png';
				if (windowId === 'window-0') img.src = 'recycle.png';
				if (windowId === 'window-3') img.src = 'text.png';

				updateTaskbarButtons();
			});
		});

		// Start button functionality
		startButton.addEventListener('click', (e) => {
			e.stopPropagation();
			startMenu.classList.toggle('show');
		});

		// Close start menu when clicking elsewhere
		document.addEventListener('click', (e) => {
			if (!startButton.contains(e.target) && !startMenu.contains(e.target)) {
				startMenu.classList.remove('show');
			}
		});

		// Volume tray click
		document.getElementById('volume-tray').addEventListener('click', () => {
			const currentVolume = Math.round(audioPlayer.volume * 100);
			alert(`Volume: ${currentVolume}%\n\nUse the music bar controls to adjust volume.`);
		});
	</script>
</body>
